[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantsentry"
version = "0.1.0"
description = "CLI scanner for quantization-conditioned backdoors in LLMs (defensive)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "typer",
    "rich",
]

[project.optional-dependencies]
hf = [
    "torch",
    "transformers",
    "huggingface_hub",
]
dev = [
    "pytest",
]

[project.scripts]
quantsentry = "quantsentry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quantsentry"]
